<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
     <link rel="stylesheet" type="text/css" href="styles/style1.css" />
  </head>
</head>
<body>
    <div>
        <nav>
            <a href="index.html">DashBoard</a> &nbsp;
            <a href="addStudent.html">Add Student</a> &nbsp;
            <a href="viewStudents.html">View Students</a> &nbsp;
            <a href="logout.html">Logout</a>
        </nav>
    </div>
    <div style="text-align: center" class="formDiv">
        <h2>Add a Student</h2>
        <form action="./viewStudents.html">
            <label for="rollNumber">Roll Number :</label>
            <input type="text" id="rollNumber" placeholder="roll number" required>
            <label for="name">Name :</label>
            <input type="text" id="name" placeholder="Name" required>
            <label for="branch">Branch:</label>
            <input type="text" id="branch" required placeholder="Branch" >
            <label for="cgpa">CGPA:</label>
            <input type="number" id="cgpa" required placeholder="CGPA" step="any">
            <button type="submit">Add Student</button>
        </form>
    </div>
</body>
</html>
